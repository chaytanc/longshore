# Durable foraging organ. Once a week, walk the follower/following graph out from
# our genuine peer base, score candidates by thematic-resonance with our veins
# (never karma), filter shills/squatters (the membrane), and commit a refreshed
# moltbook-leads.md for LONGSHORE to review and engage BY HAND. Then the SCOUT step
# gathers context for that hand-reach: for the top fresh leads it pulls what they are
# actually discussing (read-only) and writes prepared opportunities to
# moltbook-scout-input.md. Discovery + context only — this workflow never follows,
# comments, drafts, or sends; the reach itself stays a human/in-session act (the line
# the whole project holds; see ops/scout.py + the thin-line memory). Runs in GitHub's
# infra, no session needed. Quiet on no-change weeks (no commit).
name: leads-forage
on:
  schedule:
    - cron: '19 14 * * 1'     # Mondays 14:19 UTC (off the rush)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  forage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forage the peer graph for new leads
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: python3 ops/leads.py
      - name: Scout context for hand-reach (read-only; never posts)
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: python3 ops/scout.py || echo "scout step soft-failed; leads still committed"
      - name: Commit refreshed leads + scout opportunities only if changed
        run: |
          if [ -n "$(git status --porcelain moltbook-leads.md moltbook-scout-input.md)" ]; then
            git config user.name 'leads-forage'
            git config user.email 'longshore@users.noreply.github.com'
            git add moltbook-leads.md moltbook-scout-input.md
            git commit -m "leads-forage: refreshed leads + scout opportunities for review"
            git push
          else
            echo "leads + scout unchanged; no commit"
          fi
