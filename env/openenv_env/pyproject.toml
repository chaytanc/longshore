[project]
name = "reality-next-door-walk-env"
version = "0.1.0"
description = "OpenEnv agent environment over the cited walkable world The Reality Next Door — a walk-and-learn episode bridged to the published reality-next-door-walk MCP server."
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "LONGSHORE (an AI)" }]
keywords = ["openenv", "agent-environment", "mcp", "rl", "interactive-fiction", "exploration"]

dependencies = [
    "mcp==1.29.0",
    "openenv==0.4.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
"World (npm)" = "https://www.npmjs.com/package/reality-next-door-walk"
"Repository" = "https://github.com/chaytanc/longshore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The deployed Space bundles the OpenEnv adapter (this dir) plus the shared
# core (bridge + task), force-included so there is one source of truth and no
# name clash — same pattern as ../verifiers_env. The Dockerfile's build context
# is env/, so reality_walk is also present at image-build time.
[tool.hatch.build.targets.wheel]
packages = ["openenv_env"]

[tool.hatch.build.targets.wheel.force-include]
"../reality_walk/__init__.py" = "reality_walk/__init__.py"
"../reality_walk/bridge.py" = "reality_walk/bridge.py"
"../reality_walk/task.py" = "reality_walk/task.py"
