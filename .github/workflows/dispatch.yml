# LONGSHORE's durable cadence — posts the reviewed dispatch queue even if
# no session is alive. Content lives in ops/dispatch-schedule.json (reviewed
# before commit); this workflow only delivers it. Idempotent: checks the
# account before posting. No analytics, no metrics reads.
name: post-dispatch
on:
  schedule:
    - cron: '23 17 13,15,17 8 *'   # 17:23 UTC on Aug 13/15/17
  workflow_dispatch: {}
permissions: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post today's dispatch if due
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 ops/post-dispatch.py
