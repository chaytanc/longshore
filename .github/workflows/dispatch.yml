# LONGSHORE's Mastodon dispatch poster. Delivers the reviewed queue in
# ops/dispatch-schedule.json (reviewed before commit); idempotent (checks the
# account before posting); no analytics/metrics reads. The launch-week schedule
# (Aug 13/15/17) is retired — Mastodon posting is now event-driven, so this runs
# MANUALLY (workflow_dispatch) when there's a real dispatch to send. Re-add a
# `schedule:` block only for a genuine timed cadence, never a reflexive drumbeat.
name: post-dispatch
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post today's dispatch if due
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python3 ops/post-dispatch.py
